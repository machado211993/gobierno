<head>
  <meta charset="utf-8" />
  <title>Municipalidad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
  </style>
  <style>
    /* Estilo para el contenedor de logos */
    .social-logos {
      position: fixed;
      bottom: 20px;
      /* Ubicación desde la parte inferior */
      right: 20px;
      /* Ubicación desde la derecha */
      display: flex;
      /* Usar flexbox para alinear horizontalmente */
      align-items: center;
      /* Centrar verticalmente los logos */
      z-index: 1000;
      /* Asegura que el contenedor esté por encima de otros elementos */
    }

    /* Estilos para los logos */
    .social-logo {
      width: 80px;
      /* Tamaño del logo */
      height: 80px;
      /* Tamaño del logo */
      margin-left: 10px;
      /* Espacio entre los logos */
      transition: transform 0.2s;
      /* Transición para el efecto hover */
    }
    #instagram{
      /* Tamaño del logo */
      width: 160px;
      /* Tamaño del logo */
      height: 88px;
    }

    /* Efecto hover */
    .social-logo:hover {
      transform: scale(1.1);
      /* Hace que el logo se agrande al pasar el cursor */
    }
  </style>


  <style>
    .custom-nav-link {
      font-size: 1.2rem;
      /* Tamaño de fuente más grande */
      font-weight: bold;
      /* Negrita */
      color: black;
      /* Color negro */
      transition: color 0.3s;
      /* Transición suave */
    }

    .custom-nav-link:hover {
      color: #0056b3;
      /* Color al pasar el ratón (puedes cambiarlo) */
    }
  </style>

  <style>
    .section-title {
      background-color: #f8f9fa;
      /* Fondo claro */
      border: 1px solid #ccc;
      /* Borde suave */
      border-radius: 5px;
      /* Bordes redondeados */
      padding: 15px;
      /* Espaciado interno */
      text-align: center;
      /* Centrar el texto */
      margin: 20px 0;
      /* Espaciado externo */
      font-size: 2rem;
      /* Tamaño de fuente grande */
      color: #343a40;
      /* Color de texto oscuro */
    }
  </style>

</head>
