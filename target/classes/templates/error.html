<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="/fragments/head :: head"></head>

<body>
  <nav th:replace="/fragments/navbar :: nav"></nav>

  <header class="header">
    <section class="container py-5">
      <div class="text-center mb-4">
        <h1 class="display-5 fw-bold" th:text="'Error ' + ${codigo}"></h1>
        <p class="lead" th:text="${mensaje}"></p>
      </div>

      <div class="text-center mb-4">
        <a th:href="@{/}" class="btn btn-secondary">Volver</a>
      </div>

      <div class="text-center">
        <p class="fs-5" th:if="${session.usuariosession != null}"
          th:text="'Hola de vuelta ' + ${session.usuariosession.nombre}"></p>
      </div>
    </section>

    <!-- Elementos decorativos opcionales -->
    <div class="bg-circle-1 bg-circle"></div>
    <div class="bg-circle-2 bg-circle"></div>
    <div class="bg-circle-3 bg-circle"></div>
    <div class="bg-circle-4 bg-circle"></div>
  </header>

  <footer th:replace="/fragments/footer :: footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
