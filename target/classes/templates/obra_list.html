<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="/fragments/head :: head"></head>

<body>
  <nav th:replace="/fragments/navbar :: nav"></nav>
  <div th:if="${exito}!=null" class="card text-white bg-success mb-3 mt-3 mensajeExito">
    <div class="card-body">
      <h5 class="card-title">Exito ð</h5>
      <p class="card-text" th:text="${exito}"></p>
    </div>
  </div>
  <div th:if="${error}!=null" class="card text-white bg-danger mb-3 mensajeError">
    <div class="card-body">
      <h5 class="card-title">Error ð</h5>
      <p class="card-text" th:text="${error}"></p>
    </div>
  </div>
    <form class="form-inline" th:action="@{/obra/lista}">
      <div class="form-group mb-2">
        <label>Filtrar : </label>
      </div>
      <div class="form-group mx-sm-3 mb-2">
        <input type="text" name="palabraClave" class="form-control" id="palabraClave" th:value="${palabraClave}"
          placeholder="Digite el valor a buscar" required>
      </div>
      <input type="submit" class="btn btn-info mb-2" value="Buscar">
      &nbsp;&nbsp;

      <a th:href="@{/obra/lista}" class="btn btn-secondary mb-2">Limpiar</a>

      <a th:href="@{/obra/exportarPDF}" class="btn btn-secondary mb-2 mx-2"> Exportar PDF </a>
    </form>
    <table class="table table-striped table-hover" id="small-table" style="max-width: 100%; font-size: 0.8em;">
      <thead class="thead-dark">
        <tr>
          <th scope="col">Nombre Obra</th>
          <th scope="col">Contenido</th>
          <th scope="col" style="width: 15%">Alta Obra</th>
          <th scope="col" colspan="3" style="text-align: center;">Acciones</th>
        </tr>
      </thead>
      <tbody th:each="obra : ${obras}">
        <tr>
          <td th:text="${obra.nombreObra}"></td>
         
          <td>
            <a th:href="@{/obra/imagen/__${obra.idObra}__}" style="display: block; max-width: 100px; height: auto;">
              <img class="logo" th:src="@{/obra/imagen/__${obra.idObra}__}" style="max-width: 100%; height: auto;" />
            </a>
          </td>
          <td th:text="${obra.altaObra}"></td>
          <td>
            <a th:href="@{/obra/modificar/__${obra.idObra}__}" sec:authorize="hasRole('ADMIN')"><i class="fas fa-feather-alt"></i> Modificar Obra</a>
          </td>
          <td>
            <a th:href="@{/obra/eliminar/__${obra.idObra}__}" sec:authorize="hasRole('ADMIN')"><i class="fas fa-feather-alt"></i> Eliminar Obra</a>
          </td>
          <td>
            <a th:href="@{/obra/exportarPDF}"><i class="fas fa-feather-alt"></i> Exportar PDF</a>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div class="py-5 text-center container">
      <a th:href="@{/inicio}" class="btn btn-primary">Volver</a>
    </div>

    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
