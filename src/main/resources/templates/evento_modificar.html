<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="/fragments/head :: head"></head>
<body>
  <nav th:replace="/fragments/navbar :: nav"></nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Modificar Evento</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/evento/modificar/__${evento.idEvento}__}" method="POST" enctype="multipart/form-data">
              <input type="hidden" th:value="${idEvento}" name="idEvento">

              <div class="mb-3">
                <label for="nombreEvento" class="form-label">Nombre</label>
                <input type="text" id="nombreEvento" th:value="${evento.nombreEvento}" class="form-control" name="nombreEvento" placeholder="Nombre" required>
              </div>

              <div class="mb-3">
                <label for="archivo" class="form-label">Imagen</label>
                <input type="file" id="archivo" class="form-control" name="archivo" placeholder="Imagen del Evento">
              </div>

              <button type="submit" class="btn btn-primary">Actualizar</button>
            </form>

            <div th:if="${exito} != null" class="alert alert-success mt-3">
              <h5 class="alert-heading">Éxito 👍</h5>
              <p th:text="${exito}"></p>
            </div>

            <div th:if="${error} != null" class="alert alert-danger mt-3">
              <h5 class="alert-heading">Error 👎</h5>
              <p th:text="${error}"></p>
            </div>

            <div class="mt-3 text-center">
              <a th:href="@{/index}" class="btn btn-secondary">Volver</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="/fragments/footer :: footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
