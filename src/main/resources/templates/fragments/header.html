<header class="header-custom text-center" style="background-color: #d2b48c; position: relative">
  <!-- Carrusel -->
  <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/img/carouseloreto1.jpeg" class="d-block w-100" alt="First slide" />
      </div>
      <div class="carousel-item">
        <img src="/img/carouseloreto2.jpeg" class="d-block w-100" alt="Second slide" />
      </div>
      <div class="carousel-item">
        <img src="/img/carouseloreto3.jpeg" class="d-block w-100" alt="Third slide" />
      </div>
      <div class="carousel-item">
        <img src="/img/maidana.jpg" class="d-block w-100" alt="Fourth slide" />
    </div>
    <div class="carousel-item">
        <img src="/img/maidana2.jpg" class="d-block w-100" alt="Fifth slide" />
    </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</header>
