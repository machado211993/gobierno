<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="/fragments/head :: head"></head>

<body>
  <nav th:replace="/fragments/navbar :: nav"></nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <form class="form-signin" th:action="@{/perfil/__${usuario.id}__}" method="POST" enctype="multipart/form-data">
              <input type="hidden" th:value="${id}" name="id">

              <div class="text-center mb-4">
                <h5 class="card-title">Editar Usuario</h5>
              </div>

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" th:value="${usuario.nombre}" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" th:value="${usuario.email}" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña">
              </div>

              <div class="mb-3">
                <label for="password2" class="form-label">Repetir contraseña</label>
                <input type="password" class="form-control" id="password2" name="password2" placeholder="Repetir contraseña">
              </div>

              <div class="mb-3">
                <label for="archivo" class="form-label">Imagen</label>
                <input type="file" class="form-control" id="archivo" name="archivo">
              </div>

              <button type="submit" class="btn btn-primary w-100">Actualizar</button>
            </form>
          </div>

          <div class="card-footer text-center">
            <a th:href="@{/inicio}" class="btn btn-secondary">Volver</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="/fragments/footer :: footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
